<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 240" width="100%" height="240" fill="none">
  <defs>
    <!-- Deep Space Cyber Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050811" />
      <stop offset="40%" stop-color="#0a1020" />
      <stop offset="80%" stop-color="#0e172e" />
      <stop offset="100%" stop-color="#04060b" />
    </linearGradient>

    <!-- Ultra Neon Cyber Gradients -->
    <linearGradient id="cyan-purple-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F5FF" />
      <stop offset="35%" stop-color="#00FF88" />
      <stop offset="70%" stop-color="#B026FF" />
      <stop offset="100%" stop-color="#FF007A" />
    </linearGradient>

    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F5FF" />
      <stop offset="45%" stop-color="#5BF0FF" />
      <stop offset="80%" stop-color="#D946EF" />
      <stop offset="100%" stop-color="#FF3366" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="cyber-grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#16223d" stroke-width="0.8" stroke-opacity="0.6"/>
    </pattern>

    <!-- Intense Center Radial Glow -->
    <radialGradient id="center-glow" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#00F5FF" stop-opacity="0.18" />
      <stop offset="45%" stop-color="#8B5CF6" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#050811" stop-opacity="0" />
    </radialGradient>

    <!-- Neon Text Glow Filter -->
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur1" />
      <feGaussianBlur stdDeviation="8" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="920" height="240" rx="16" fill="url(#bg-grad)" />
  <rect width="920" height="240" rx="16" fill="url(#cyber-grid)" />
  <rect width="920" height="240" rx="16" fill="url(#center-glow)" />

  <!-- Outer Cyber Hologram Border -->
  <rect x="1.5" y="1.5" width="917" height="237" rx="15" fill="none" stroke="url(#cyan-purple-glow)" stroke-width="1.6" stroke-opacity="0.75" />

  <!-- Tactical Corner Brackets -->
  <path d="M 16 34 L 16 16 L 34 16" stroke="#00F5FF" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M 886 16 L 904 16 L 904 34" stroke="#FF007A" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M 16 206 L 16 224 L 34 224" stroke="#00FF88" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M 886 224 L 904 224 L 904 206" stroke="#00F5FF" stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- Top Status HUD -->
  <g transform="translate(315, 22)">
    <rect x="0" y="0" width="290" height="24" rx="12" fill="#0C1527" stroke="#00F5FF" stroke-width="1" stroke-opacity="0.7"/>
    <circle cx="16" cy="12" r="4.5" fill="#00FF88">
      <animate attributeName="opacity" values="1;0.2;1" dur="1.8s" repeatCount="indefinite" />
      <animate attributeName="r" values="4.5;5.5;4.5" dur="1.8s" repeatCount="indefinite" />
    </circle>
    <text x="30" y="16.5" fill="#00FFCC" font-family="'Fira Code', monospace" font-size="10.5" font-weight="700" letter-spacing="2">CORE ARCHITECT // HYPER-VELOCITY</text>
  </g>

  <!-- Main Hero Title -->
  <text x="460" y="102" text-anchor="middle" fill="url(#title-grad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Montserrat', 'Inter', sans-serif" font-size="48" font-weight="950" letter-spacing="5" filter="url(#neon-glow)">DONIYOR MUSAYEV</text>

  <!-- Tactical Divider Line with Circuit Diamond -->
  <path d="M 230 120 L 440 120" stroke="url(#cyan-purple-glow)" stroke-width="1.8" stroke-linecap="round" stroke-opacity="0.85"/>
  <polygon points="460,116 465,120 460,124 455,120" fill="#00F5FF" />
  <path d="M 480 120 L 690 120" stroke="url(#cyan-purple-glow)" stroke-width="1.8" stroke-linecap="round" stroke-opacity="0.85"/>

  <!-- Elite Subtitle -->
  <text x="460" y="148" text-anchor="middle" fill="#F8FAFC" font-family="'Fira Code', monospace" font-size="13.5" font-weight="700" letter-spacing="3.5">FOUNDER &amp; CTO  •  AUTONOMOUS AI &amp; DEEP-TECH ARCHITECT</text>

  <!-- Cyber Pill Telemetry Bar -->
  <g transform="translate(95, 178)">
    <!-- Pill 1: Age & Title -->
    <rect x="0" y="0" width="165" height="30" rx="8" fill="#0E182A" stroke="#00F5FF" stroke-width="1.1"/>
    <text x="82" y="19" text-anchor="middle" fill="#00F5FF" font-family="'Fira Code', monospace" font-size="11" font-weight="700">⚡ 17 Y.O. PRODIGY</text>

    <!-- Pill 2: Leadership -->
    <rect x="180" y="0" width="175" height="30" rx="8" fill="#0E182A" stroke="#A855F7" stroke-width="1.1"/>
    <text x="267" y="19" text-anchor="middle" fill="#C084FC" font-family="'Fira Code', monospace" font-size="11" font-weight="700">🚀 CTO @ UNIIN &amp; SADOO</text>

    <!-- Pill 3: Venture Ambassador -->
    <rect x="370" y="0" width="195" height="30" rx="8" fill="#0E182A" stroke="#10B981" stroke-width="1.1"/>
    <text x="467" y="19" text-anchor="middle" fill="#34D399" font-family="'Fira Code', monospace" font-size="11" font-weight="700">🌐 VENTURE AMBASSADOR</text>

    <!-- Pill 4: Honors -->
    <rect x="580" y="0" width="150" height="30" rx="8" fill="#0E182A" stroke="#F59E0B" stroke-width="1.1"/>
    <text x="655" y="19" text-anchor="middle" fill="#FBBF24" font-family="'Fira Code', monospace" font-size="11" font-weight="700">🏆 AI500 ELITE FINALIST</text>
  </g>
</svg>
