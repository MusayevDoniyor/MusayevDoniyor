<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 220" width="100%" height="220" fill="none">
  <defs>
    <linearGradient id="uzex-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d14" />
      <stop offset="50%" stop-color="#121824" />
      <stop offset="100%" stop-color="#070a0f" />
    </linearGradient>

    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="50%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>

    <pattern id="grid-dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#2d3748" fill-opacity="0.5"/>
    </pattern>

    <filter id="gold-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="220" rx="12" fill="url(#uzex-bg)" />
  <rect width="600" height="220" rx="12" fill="url(#grid-dots)" />
  <rect x="1" y="1" width="598" height="218" rx="11" fill="none" stroke="url(#gold-grad)" stroke-width="1.2" stroke-opacity="0.6"/>

  <!-- Candlestick chart watermark in background -->
  <g opacity="0.12" stroke="#F59E0B" stroke-width="1.5">
    <line x1="80" y1="50" x2="80" y2="160" />
    <rect x="72" y="80" width="16" height="50" fill="#10B981" />
    <line x1="140" y1="30" x2="140" y2="180" />
    <rect x="132" y="60" width="16" height="70" fill="#EF4444" />
    <line x1="200" y1="40" x2="200" y2="170" />
    <rect x="192" y="70" width="16" height="60" fill="#10B981" />
    <line x1="420" y1="60" x2="420" y2="180" />
    <rect x="412" y="90" width="16" height="50" fill="#10B981" />
    <line x1="490" y1="30" x2="490" y2="150" />
    <rect x="482" y="50" width="16" height="60" fill="#10B981" />
  </g>

  <!-- Terminal Badge -->
  <g transform="translate(200, 25)">
    <rect x="0" y="0" width="200" height="22" rx="11" fill="#1E293B" stroke="#F59E0B" stroke-width="0.8" stroke-opacity="0.8"/>
    <circle cx="12" cy="11" r="3.5" fill="#10B981"/>
    <text x="24" y="14.5" fill="#FBBF24" font-family="'Fira Code', monospace" font-size="9.5" font-weight="700" letter-spacing="1.5">UZEX COMMODITY AGENT</text>
  </g>

  <!-- Main Title -->
  <text x="300" y="85" text-anchor="middle" fill="url(#gold-grad)" font-family="'Inter', sans-serif" font-size="28" font-weight="900" letter-spacing="3" filter="url(#gold-glow)">UZEX AI ENGINE</text>
  <text x="300" y="112" text-anchor="middle" fill="#94A3B8" font-family="'Fira Code', monospace" font-size="11" font-weight="600" letter-spacing="1.5">500,000+ DEALS • PREDICTIVE BIDDING • CONTRACT INTELLIGENCE</text>

  <!-- Telemetry Pills -->
  <g transform="translate(50, 145)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="150" height="26" rx="6" fill="#172033" stroke="#F59E0B" stroke-width="0.8"/>
    <text x="75" y="16.5" text-anchor="middle" fill="#FBBF24" font-family="'Fira Code', monospace" font-size="9.5" font-weight="700">📊 500K+ TRADES</text>

    <!-- Pill 2 -->
    <rect x="175" y="0" width="150" height="26" rx="6" fill="#172033" stroke="#10B981" stroke-width="0.8"/>
    <text x="250" y="16.5" text-anchor="middle" fill="#34D399" font-family="'Fira Code', monospace" font-size="9.5" font-weight="700">⚡ ZERO HALLUCINATION</text>

    <!-- Pill 3 -->
    <rect x="350" y="0" width="150" height="26" rx="6" fill="#172033" stroke="#60A5FA" stroke-width="0.8"/>
    <text x="425" y="16.5" text-anchor="middle" fill="#93C5FD" font-family="'Fira Code', monospace" font-size="9.5" font-weight="700">🤖 FASTAPI SWARMS</text>
  </g>
</svg>
