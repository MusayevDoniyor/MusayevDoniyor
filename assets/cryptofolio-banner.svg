<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 220" width="100%" height="220" fill="none">
  <defs>
    <linearGradient id="crypto-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#051412" />
      <stop offset="50%" stop-color="#0c2420" />
      <stop offset="100%" stop-color="#040e0c" />
    </linearGradient>

    <linearGradient id="crypto-neon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="50%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>

    <pattern id="grid-dots-crypto" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#047857" fill-opacity="0.4"/>
    </pattern>

    <filter id="emerald-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="220" rx="12" fill="url(#crypto-bg)" />
  <rect width="600" height="220" rx="12" fill="url(#grid-dots-crypto)" />
  <rect x="1" y="1" width="598" height="218" rx="11" fill="none" stroke="url(#crypto-neon)" stroke-width="1.2" stroke-opacity="0.6"/>

  <!-- Pulse Waveform Watermark -->
  <g opacity="0.12" stroke="#10B981" stroke-width="2" fill="none">
    <path d="M 0 110 L 100 110 L 130 60 L 160 150 L 190 90 L 220 120 L 300 120 L 330 70 L 360 160 L 390 80 L 420 110 L 600 110" />
  </g>

  <!-- HUD Tag -->
  <g transform="translate(195, 25)">
    <rect x="0" y="0" width="210" height="22" rx="11" fill="#064E3B" stroke="#10B981" stroke-width="0.8" stroke-opacity="0.8"/>
    <circle cx="12" cy="11" r="3.5" fill="#34D399"/>
    <text x="24" y="14.5" fill="#A7F3D0" font-family="'Fira Code', monospace" font-size="9.5" font-weight="700" letter-spacing="1.5">DECENTRALIZED TELEMETRY</text>
  </g>

  <!-- Title -->
  <text x="300" y="85" text-anchor="middle" fill="url(#crypto-neon)" font-family="'Inter', sans-serif" font-size="28" font-weight="900" letter-spacing="3" filter="url(#emerald-glow)">CRYPTOFOLIO</text>
  <text x="300" y="112" text-anchor="middle" fill="#94A3B8" font-family="'Fira Code', monospace" font-size="11" font-weight="600" letter-spacing="1.5">REAL-TIME FEEDS • ALLOCATION RADAR • LOCAL-FIRST</text>

  <!-- Pills -->
  <g transform="translate(50, 145)">
    <rect x="0" y="0" width="150" height="26" rx="6" fill="#064E3B" stroke="#10B981" stroke-width="0.8"/>
    <text x="75" y="16.5" text-anchor="middle" fill="#A7F3D0" font-family="'Fira Code', monospace" font-size="9.5" font-weight="700">⚡ LIVE ASSET FEEDS</text>

    <rect x="175" y="0" width="150" height="26" rx="6" fill="#064E3B" stroke="#06B6D4" stroke-width="0.8"/>
    <text x="250" y="16.5" text-anchor="middle" fill="#67E8F9" font-family="'Fira Code', monospace" font-size="9.5" font-weight="700">📊 CHART.JS RADAR</text>

    <rect x="350" y="0" width="150" height="26" rx="6" fill="#064E3B" stroke="#3B82F6" stroke-width="0.8"/>
    <text x="425" y="16.5" text-anchor="middle" fill="#93C5FD" font-family="'Fira Code', monospace" font-size="9.5" font-weight="700">🔒 ZERO TRACKING</text>
  </g>
</svg>
